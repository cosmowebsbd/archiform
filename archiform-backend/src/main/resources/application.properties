# ââ Server âââââââââââââââââââââââââââââââââââââââââââââââââââ
server.port=8080
server.error.include-message=always

# ââ Application âââââââââââââââââââââââââââââââââââââââââââââââ
spring.application.name=archiform-backend

# ââ PostgreSQL ââââââââââââââââââââââââââââââââââââââââââââââââ
spring.datasource.url=jdbc:postgresql://localhost:5432/archiform
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ââ JPA / Hibernate âââââââââââââââââââââââââââââââââââââââââââ
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# ââ Flyway ââââââââââââââââââââââââââââââââââââââââââââââââââââ
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ââ Redis âââââââââââââââââââââââââââââââââââââââââââââââââââââ
#spring.data.redis.host=localhost
#spring.data.redis.port=6379
#spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# ââ Cache âââââââââââââââââââââââââââââââââââââââââââââââââââââ
#spring.cache.type=none
#spring.cache.redis.time-to-live=900000
#spring.cache.redis.cache-null-values=false

# ââ GraphQL âââââââââââââââââââââââââââââââââââââââââââââââââââ
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.path=/graphql
spring.graphql.schema.locations=classpath:graphql/
spring.graphql.schema.file-extensions=.graphqls
spring.graphql.cors.allowed-origins=http://localhost:3000
spring.graphql.cors.allowed-methods=GET,POST,OPTIONS
spring.graphql.cors.allowed-headers=*
spring.graphql.cors.allow-credentials=true

# ââ JWT âââââââââââââââââââââââââââââââââââââââââââââââââââââââ
app.jwt.secret=${JWT_SECRET:archiform2025COSMOAITechnologiesBangladeshSecretKeyForJWTTokenGenerationMustBeLongEnough512Bits}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration-ms=604800000

# ââ Logging âââââââââââââââââââââââââââââââââââââââââââââââââââ
logging.level.com.archiform=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.graphql=INFO
#logging.level.org.hibernate.SQL=INFO

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
server.error.include-stacktrace=always
spring.jpa.open-in-view=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
# SendGrid — add real key before deploying
app.sendgrid.api-key=${SENDGRID_API_KEY:SG.placeholder}
app.sendgrid.from-email=${SENDGRID_FROM_EMAIL:noreply@archiform.app}
app.sendgrid.from-name=${SENDGRID_FROM_NAME:Archiform}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
